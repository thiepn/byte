[package]
name = "byte-desktop"
version = "0.1.0"
description = "Byte desktop companion"
edition = "2021"

[lib]
name = "byte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tempfile = "3"
thiserror = "2"
