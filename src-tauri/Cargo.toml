[package]
name = "byte-desktop"
version = "0.1.0"
description = "Privacy-first Windows desktop companion for understandable system health"
authors = ["thiepn"]
homepage = "https://github.com/thiepn/byte"
repository = "https://github.com/thiepn/byte"
edition = "2021"

[lib]
name = "byte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.3.3"
tempfile = "3"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
