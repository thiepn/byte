[package]
name = "byte-desktop"
version = "0.1.0"
description = "Byte desktop companion"
edition = "2021"

[lib]
name = "byte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
tauri = { version = "2", features = ["tray-icon"] }
tempfile = "3"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
