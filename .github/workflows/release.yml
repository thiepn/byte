name: Byte Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag and release metadata
        shell: pwsh
        run: npm run release:verify -- --tag $env:GITHUB_REF_NAME

      - name: Verify maintenance policy
        run: npm run maintenance:verify

      - name: Extract curated release notes
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          node scripts/extract-release-notes.mjs --version $version --output release-notes.md

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

      - name: Discover previous published release
        id: previous
        shell: pwsh
        run: |
          $items = gh release list --limit 50 --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json
          $previous = $items |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $env:GITHUB_REF_NAME } |
            Select-Object -First 1
          if ($null -ne $previous) {
            "tag=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Previous release: $($previous.tagName)"
          } else {
            Write-Host "No previous published Byte release found."
          }

      - name: Verify release ordering
        if: steps.previous.outputs.tag != ''
        shell: pwsh
        run: node scripts/check-release-order.mjs --current $env:GITHUB_REF_NAME --previous "${{ steps.previous.outputs.tag }}"

      - name: Prepare optional Windows code signing
        shell: pwsh
        run: ./scripts/prepare-windows-signing.ps1

      - name: Build release installer
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Stage release artifacts
        shell: pwsh
        run: ./scripts/stage-release.ps1

      - name: Verify staged release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1

      - name: Portable launch smoke test
        shell: pwsh
        run: |
          $portable = (Get-ChildItem "release-artifacts\*-portable.zip" -File | Select-Object -First 1).FullName
          ./scripts/test-portable-launch.ps1 -Portable $portable

      - name: Download previous installer for upgrade certification
        id: previous_installer
        if: steps.previous.outputs.tag != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "previous-release" -Force | Out-Null
          gh release download "${{ steps.previous.outputs.tag }}" --pattern "*windows-x64-setup.exe" --dir "previous-release"
          if ($LASTEXITCODE -eq 0) {
            $file = Get-ChildItem "previous-release\*-setup.exe" -File | Select-Object -First 1
            if ($null -ne $file) {
              "path=$($file.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          } else {
            Write-Host "Previous release has no Phase 26-compatible installer; using reinstall smoke coverage."
            exit 0
          }

      - name: Install, upgrade, downgrade-policy, data-preservation, and uninstall certification
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release-artifacts\*-setup.exe" -File | Select-Object -First 1).FullName
          $previous = "${{ steps.previous_installer.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($previous)) {
            ./scripts/test-windows-installer.ps1 -Installer $installer
          } else {
            ./scripts/test-windows-installer.ps1 -Installer $installer -PreviousInstaller $previous
          }

      - name: Finalize release certification
        shell: pwsh
        run: |
          $previous = "${{ steps.previous_installer.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($previous)) {
            ./scripts/finalize-release-certification.ps1
          } else {
            ./scripts/finalize-release-certification.ps1 -PreviousReleaseTested
          }

      - name: Verify certified release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -RequireCertification

      - name: Attest installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "release-artifacts/*-setup.exe"

      - name: Attest portable provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "release-artifacts/*-portable.zip"

      - name: Verify GitHub artifact attestations
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release-artifacts\*-setup.exe" -File | Select-Object -First 1).FullName
          $portable = (Get-ChildItem "release-artifacts\*-portable.zip" -File | Select-Object -First 1).FullName
          gh attestation verify $installer --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh attestation verify $portable --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release build for workflow retention
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byte-${{ github.ref_name }}-windows-x64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $assets = Get-ChildItem "release-artifacts" -File | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $arguments = @("release", "upload", $tag, "--clobber")
            $arguments += $assets
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $arguments = @(
              "release", "create", $tag,
              "--verify-tag",
              "--title", "Byte $version",
              "--notes-file", "release-notes.md"
            )
            if ($version -match "-beta\.") {
              $arguments += "--prerelease"
            }
            $arguments += $assets
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Clean signing material
        if: always()
        shell: pwsh
        run: ./scripts/cleanup-windows-signing.ps1
