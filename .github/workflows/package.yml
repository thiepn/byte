name: Byte Packaging Certification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: byte-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify

      - name: Verify maintenance policy
        run: npm run maintenance:verify

      - name: Verify physical device signoff tooling
        shell: pwsh
        run: ./scripts/test-physical-device-signoff-tooling.ps1

      - name: Verify release approval tooling
        shell: pwsh
        run: ./scripts/test-release-approval-tooling.ps1

      - name: Verify controlled release initiation tooling
        shell: pwsh
        run: ./scripts/test-release-initiation-tooling.ps1

      - name: Verify release completion tooling
        shell: pwsh
        run: ./scripts/test-release-completion-tooling.ps1

      - name: Verify Windows signing policy harness
        shell: pwsh
        run: ./scripts/test-windows-signing-policy.ps1

      - name: Verify current release notes extraction
        shell: pwsh
        run: |
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          node scripts/extract-release-notes.mjs --version $version --output "$env:RUNNER_TEMP\byte-release-notes.md"

      - name: Build production NSIS package
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Stage release artifacts
        shell: pwsh
        run: ./scripts/stage-release.ps1

      - name: Verify staged release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1

      - name: Portable launch smoke test
        shell: pwsh
        run: |
          $portable = (Get-ChildItem "release-artifacts\*-portable.zip" -File | Select-Object -First 1).FullName
          ./scripts/test-portable-launch.ps1 -Portable $portable

      - name: Install, reinstall, data-preservation, and uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release-artifacts\*-setup.exe" -File | Select-Object -First 1).FullName
          ./scripts/test-windows-installer.ps1 -Installer $installer

      - name: Real-world product runtime certification
        shell: pwsh
        run: |
          $portable = (Get-ChildItem "release-artifacts\*-portable.zip" -File | Select-Object -First 1).FullName
          ./scripts/test-real-world-product.ps1 -Portable $portable

      - name: Finalize release certification
        shell: pwsh
        run: ./scripts/finalize-release-certification.ps1

      - name: Verify certified release artifacts
        shell: pwsh
        run: ./scripts/verify-release-artifacts.ps1 -RequireCertification

      - name: Test physical device report verifier
        shell: pwsh
        run: ./scripts/test-physical-device-signoff-verifier.ps1 -CandidateDir release-artifacts

      - name: Test release approval verifier
        shell: pwsh
        run: ./scripts/test-release-approval-verifier.ps1 -CandidateDir release-artifacts

      - name: Test P7 public release verifier
        shell: pwsh
        run: ./scripts/test-public-release-certification-verifier.ps1 -CandidateDir release-artifacts


      - name: Upload certified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byte-release-candidate-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
