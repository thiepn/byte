name: Byte Packaging Certification

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:verify

      - name: Build production NSIS package
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Stage release artifacts
        shell: pwsh
        run: ./scripts/stage-release.ps1

      - name: Install, reinstall, and uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release-artifacts\*-setup.exe" -File | Select-Object -First 1).FullName
          ./scripts/test-windows-installer.ps1 -Installer $installer

      - name: Upload packaged build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: byte-windows-package-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 14
